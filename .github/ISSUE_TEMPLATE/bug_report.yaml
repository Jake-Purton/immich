name: Report an issue with Jake-Purton/Immich
description: issue
body:
  - type: textarea
    validations:
      required: true

    attributes:
      label: The bug / feature
      description: >-
        Provide a clear and concise description of what the problem or feature is.
        Ensure that the issue is with the server container, and with this particular fork.
        Otherwise try https://github.com/immich-app/immich/

  - type: markdown
    attributes:
      value: |
        ## Environment

  - type: input
    validations:
      required: false
    attributes:
      label: The OS that Immich Server is running on
      placeholder: Ubuntu 22.10, Debian, Arch...etc

  - type: input
    id: version
    validations:
      required: true
    attributes:
      label: Version of Immich Server
      placeholder: ghcr.io/jake-purton/immich-server:commit-5366664

  - type: textarea
    validations:
      required: false
    attributes:
      label: Your docker-compose.yml content
      render: YAML

  - type: textarea
    validations:
      required: false
    attributes:
      label: Your .env content
      description: Please provide the redacted .env content of your setup
      render: Shell

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps in the case of bugs
      description: 'How do you trigger this bug? Please walk us through it step by step.'
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description:
        Please copy and paste any relevant logs below. (code formatting is
        enabled, no need for backticks)
      render: shell
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional information
      description: >
        If you have any additional information for us, use the field below.

  - type: markdown
    attributes:
      value: Thank you for submitting the form
